{{- if .Values.gke.enabled -}}
# Google-managed TLS certificate for gke-ingress.yaml — GKE requests, renews,
# and installs it automatically once DNS resolves to the reserved static IP.
# Provisioning can take up to ~30-60 minutes after DNS propagates; check with:
#   kubectl -n {{ .Release.Namespace }} describe managedcertificate {{ include "qless-cafe.fullname" . }}-cert
# https://cloud.google.com/kubernetes-engine/docs/how-to/managed-certs
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "qless-cafe.fullname" . }}-cert
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "qless-cafe" "component" "ingress") $) | nindent 4 }}
spec:
  domains:
    {{- toYaml (required "gke.certificateDomains is required when gke.enabled" .Values.gke.certificateDomains) | nindent 4 }}
{{- end }}
