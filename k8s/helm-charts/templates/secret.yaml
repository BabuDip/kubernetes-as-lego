# Values come only from -f secrets-{uat,prod}.yaml (git-ignored) or --set-string
# — see values.yaml's secrets.* comment and secrets-*.yaml.example. Never
# committed with real values, same convention as k8s/overlays/*/secrets.env.
apiVersion: v1
kind: Secret
metadata:
  name: qless-cafe-secrets
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "qless-cafe" "component" "config") $) | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "secrets.djangoSecretKey is required — see secrets-*.yaml.example" .Values.secrets.djangoSecretKey | quote }}
  POSTGRES_USER: {{ required "secrets.postgresUser is required — see secrets-*.yaml.example" .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required — see secrets-*.yaml.example" .Values.secrets.postgresPassword | quote }}
  {{- if .Values.secrets.djangoAdminUrl }}
  DJANGO_ADMIN_URL: {{ .Values.secrets.djangoAdminUrl | quote }}
  {{- end }}
