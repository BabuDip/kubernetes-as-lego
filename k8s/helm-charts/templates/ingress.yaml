{{- if and .Values.ingress.enabled (not .Values.gke.enabled) -}}
# Portable Ingress (ingressClassName: nginx) — works the same way locally
# (`minikube addons enable ingress`) and on any cluster with ingress-nginx
# installed, unlike the GKE-native gke-ingress.yaml sibling.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qless-cafe
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "qless-cafe" "component" "ingress") $) | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
{{- end }}
