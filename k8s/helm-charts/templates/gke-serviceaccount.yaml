{{- if .Values.gke.enabled -}}
# Workload Identity: lets only the django Pods call GCS — collectstatic to
# the public static bucket, signed URLs against the private media bucket —
# as a real GCP service account, with no downloaded JSON key file anywhere.
# https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qless-cafe.fullname" . }}-django
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "django" "component" "web") $) | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "gke.serviceAccountEmail is required when gke.enabled" .Values.gke.serviceAccountEmail | quote }}
{{- end }}
