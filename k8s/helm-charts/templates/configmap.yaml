# Non-secret settings shared by every container that runs Django code.
# Service names (postgres, redis) resolve via in-cluster DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qless-cafe-config
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "qless-cafe" "component" "config") $) | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: {{ .Values.config.settingsModule | quote }}
  DJANGO_ALLOWED_HOSTS: {{ .Values.config.allowedHosts | quote }}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  {{- if .Values.config.gcpStaticBucketName }}
  DJANGO_GCP_STATIC_BUCKET_NAME: {{ .Values.config.gcpStaticBucketName | quote }}
  {{- end }}
  {{- if .Values.config.gcpMediaBucketName }}
  DJANGO_GCP_MEDIA_BUCKET_NAME: {{ .Values.config.gcpMediaBucketName | quote }}
  {{- end }}
  {{- if .Values.config.emailBackend }}
  DJANGO_EMAIL_BACKEND: {{ .Values.config.emailBackend | quote }}
  {{- end }}
