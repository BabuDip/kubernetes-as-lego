{{- if .Values.gke.enabled -}}
# Configures the GCE health check that the GKE Ingress uses for the django
# backend — without this, ingress-gce derives a health check from the
# Service's port alone (path "/", no Host header), and Django's
# ALLOWED_HOSTS rejects it (400 DisallowedHost) as a permanent UNHEALTHY
# backend. Attached to django-service.yaml via the
# cloud.google.com/backend-config annotation.
# https://cloud.google.com/kubernetes-engine/docs/how-to/configure-backendconfig
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: django-backendconfig
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "django" "component" "web") $) | nindent 4 }}
spec:
  healthCheck:
    type: HTTP
    requestPath: /healthcheck/
    port: 8000
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
{{- end }}
