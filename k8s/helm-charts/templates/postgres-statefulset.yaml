# Hand-written StatefulSet for Postgres — stable network identity + a PVC per
# replica. Moving this to CloudNativePG (an operator + Cluster CRD) is a
# later lesson (see ../../../README.md's Step 8); this is the "raw
# primitives" version, templated from k8s/base/postgres-statefulset.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "qless-cafe.fullname" . }}-postgres
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "postgres" "component" "database") $) | nindent 4 }}
spec:
  serviceName: {{ include "qless-cafe.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "qless-cafe.selectorLabels" (merge (dict "app" "postgres" "component" "database") $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qless-cafe.labels" (merge (dict "app" "postgres" "component" "database") $) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: {{ include "qless-cafe.fullname" . }}-config
            - secretRef:
                name: {{ include "qless-cafe.fullname" . }}-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              # Exec probes run without a shell, so $(VAR) isn't expanded —
              # invoke a shell explicitly to read the env vars.
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
