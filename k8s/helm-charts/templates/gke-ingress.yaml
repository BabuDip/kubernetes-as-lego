{{- if .Values.gke.enabled -}}
# GKE's built-in Ingress controller (class "gce") provisions an external
# Application Load Balancer backed by container-native load balancing (NEGs).
# TLS terminates here using the Google-managed cert from
# gke-managedcertificate.yaml; the static IP is the one reserved out-of-band
# (see k8s/README.md's GKE runbook).
# https://cloud.google.com/kubernetes-engine/docs/concepts/ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "qless-cafe.fullname" . }}
  labels:
    {{- include "qless-cafe.labels" (merge (dict "app" "qless-cafe" "component" "ingress") $) | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: {{ required "gke.staticIpName is required when gke.enabled" .Values.gke.staticIpName | quote }}
    networking.gke.io/managed-certificates: "{{ include "qless-cafe.fullname" . }}-cert"
    networking.gke.io/v1beta1.FrontendConfig: "{{ include "qless-cafe.fullname" . }}-frontend-config"
spec:
  rules:
    {{- range .Values.gke.certificateDomains }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "qless-cafe.fullname" $ }}-django
                port:
                  number: 8000
    {{- end }}
{{- end }}
