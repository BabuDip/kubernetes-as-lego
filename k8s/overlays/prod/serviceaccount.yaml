# Workload Identity: lets only the django Pods (see kustomization.yaml's
# patch adding this as django's serviceAccountName) call GCS — collectstatic
# to the public static bucket, signed URLs against the private media bucket —
# as a real GCP service account, with no downloaded JSON key file anywhere.
# celery-worker/celery-beat/migrate keep the namespace's "default" KSA, which
# is bound to nothing: least privilege, since they never touch GCS.
# https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qless-cafe-django
  annotations:
    iam.gke.io/gcp-service-account: qless-cafe-django@sandbox-k8s-as-lego.iam.gserviceaccount.com
