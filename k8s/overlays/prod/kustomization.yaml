# Deploy: kubectl apply -k k8s/overlays/prod
# Needs k8s/overlays/prod/secrets.env first — copy secrets.env.example and
# fill in real values (this file is git-ignored, never commit real secrets).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qless-cafe-prod

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: prod

# Image tag is set at deploy time, e.g.:
#   kustomize edit set image qless-cafe=REGISTRY/qless-cafe:$SHORT_SHA
images:
  - name: qless-cafe

secretGenerator:
  - name: qless-cafe-secrets
    envs:
      - secrets.env

# A second replica of django/celery-worker so a rollout always leaves one
# pod serving traffic — the uat overlay stays at the base's single replica.
# The Ingress host isn't in config.settings.local's default ALLOWED_HOSTS.
patches:
  - target:
      kind: ConfigMap
      name: qless-cafe-config
    patch: |-
      - op: add
        path: /data/DJANGO_ALLOWED_HOSTS
        value: qless.cafe,localhost,127.0.0.1
  - target:
      kind: Deployment
      name: django
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: celery-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
