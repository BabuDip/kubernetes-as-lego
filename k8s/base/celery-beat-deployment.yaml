# Must stay at exactly 1 replica — two beat schedulers would double-fire
# every periodic task. No HPA, unlike django/celery-worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app: celery-beat
    component: task-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
      component: task-scheduler
  template:
    metadata:
      labels:
        app: celery-beat
        component: task-scheduler
    spec:
      containers:
        - name: celery-beat
          image: qless-cafe
          imagePullPolicy: IfNotPresent
          # args, not command: keeps the image's ENTRYPOINT (/entrypoint,
          # which waits for Postgres before exec"ing this) intact.
          args: ["/start-celerybeat"]
          envFrom:
            - configMapRef:
                name: qless-cafe-config
            - secretRef:
                name: qless-cafe-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
