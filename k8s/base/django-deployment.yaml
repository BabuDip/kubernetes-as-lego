# Same image and settings module as k8s/pod.yaml (Step 4's single Pod), now
# managed by a Deployment: rolling updates, self-healing, and replica count
# instead of a one-off Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  labels:
    app: django
    component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: django
      component: web
  template:
    metadata:
      labels:
        app: django
        component: web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: django
          # Placeholder — replaced by the overlay's `images:` entry.
          image: qless-cafe
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "manage.py", "runserver", "0.0.0.0:8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: qless-cafe-config
            - secretRef:
                name: qless-cafe-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
              # config.settings.local's ALLOWED_HOSTS doesn't include the pod
              # IP kubelet probes with by default.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
