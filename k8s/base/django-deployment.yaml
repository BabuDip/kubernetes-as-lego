# Runs the production image (compose/production/django/Dockerfile): gunicorn
# + uvicorn worker behind the container's own /entrypoint, which already
# waits for Postgres (compose/production/django/entrypoint) — no separate
# wait-for-postgres initContainer needed here, unlike the Step 4 tutorial Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  labels:
    app: django
    component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: django
      component: web
  template:
    metadata:
      labels:
        app: django
        component: web
    spec:
      containers:
        - name: django
          # Placeholder — replaced by the overlay's `images:` entry.
          image: qless-cafe
          imagePullPolicy: IfNotPresent
          # args (not command): the image's ENTRYPOINT is /entrypoint, which
          # waits for Postgres before exec"ing this — command would replace
          # ENTRYPOINT outright and skip that wait. /start runs collectstatic
          # (to the public GCS static bucket) then gunicorn+uvicorn — see
          # compose/production/django/start.
          args: ["/start"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: qless-cafe-config
            - secretRef:
                name: qless-cafe-secrets
          readinessProbe:
            httpGet:
              # Unauthenticated, no DB/Redis dependency, exempted from
              # SECURE_SSL_REDIRECT (see config.settings.production) — see
              # config/views.py.
              path: /healthcheck/
              port: http
              # config.settings.production's ALLOWED_HOSTS is the real host
              # only by default — the overlay patches in "localhost" too so
              # kubelet's probe (which sends this Host header) isn't rejected.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
