# Non-secret settings shared by every container that runs Django code.
# Service names (postgres, redis) resolve via in-cluster DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qless-cafe-config
data:
  # This app is deployed to a real GKE cluster only (see k8s/README.md) —
  # config.settings.production, not .local, is the base default. Overlay-
  # specific, non-secret bits (allowed hosts, GCS bucket names, email backend)
  # are layered on via kustomize patches — see overlays/prod/kustomization.yaml.
  DJANGO_SETTINGS_MODULE: config.settings.production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: qless_cafe
  REDIS_URL: redis://redis:6379/0
