# Run migrations before rolling out a new django-deployment.yaml image.
# Re-applying this manifest with the same name is a no-op once Complete;
# CI/CD gives each release a unique name (see overlays/*/kustomization.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app: migrate
    component: database-migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: migrate
        component: database-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: qless-cafe
          imagePullPolicy: IfNotPresent
          # args, not command: keeps the image's ENTRYPOINT (/entrypoint,
          # which waits for Postgres before exec"ing this) intact. No uv in
          # the production run-stage image (only the built venv, already on
          # PATH) — call python directly, same as compose/production/django/start.
          args: ["python", "/app/manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: qless-cafe-config
            - secretRef:
                name: qless-cafe-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
